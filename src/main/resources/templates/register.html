<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Feedback register')}"></head>
<body>
<div class="shell">
    <nav th:replace="~{fragments :: sidebar('register')}"></nav>
    <main class="main">
        <header class="page-head">
            <div>
                <p class="crumb"><span th:text="${project.name}"></span>
                    <span th:text="${allCycles} ? 'All UAT cycles' : ${cycle.name}"></span>
                    <a th:if="${cycle != null}" th:href="${allCycles} ? @{/} : @{/(all=true)}"
                       th:text="${allCycles} ? 'Show ' + ${cycle.name} + ' only' : 'Show all cycles'"></a></p>
                <h1 class="title">Feedback register</h1>
            </div>
            <div class="actions">
                <form th:if="${me.canTriage()}" method="post" enctype="multipart/form-data"
                      th:action="@{/import(_csrf=${_csrf.token})}" class="inline">
                    <label class="btn ghost file-btn">Import Excel
                        <input type="file" name="file" accept=".xlsx,.xls" data-autosubmit hidden>
                    </label>
                </form>
                <a class="btn ghost" th:href="${allCycles} ? @{/export(all=true)} : @{/export}">Export</a>
                <a th:if="${me.canLog() and cycle != null and cycle.open}" class="btn primary" th:href="@{/feedback/new}">+ Log feedback</a>
            </div>
        </header>

        <div th:replace="~{fragments :: flash}"></div>

        <nav class="strip" aria-label="Filter by stage">
            <a th:each="c : ${counts}" th:href="${allCycles} ? @{/(stage=${c.stage().name()}, all=true)} : @{/(stage=${c.stage().name()})}"
               th:classappend="(${fStage} == ${c.stage()} ? 'on ' : '') + 's-' + ${c.stage().css}">
                <span class="strip-label"><i></i><span th:text="${c.stage().label}"></span></span>
                <b th:text="${c.count()}"></b>
            </a>
        </nav>

        <form class="filters" method="get" th:action="@{/}">
            <label class="sr" for="q">Search feedback</label>
            <input id="q" type="search" name="q" th:value="${q}" placeholder="Search ID, title, screen, Jira key">
            <label class="sr" for="f-lob">Line of business</label>
            <select id="f-lob" name="lob" data-autosubmit>
                <option value="">All LOBs</option>
                <option th:each="l : ${lobs}" th:value="${l}" th:text="${l}" th:selected="${l == fLob}"></option>
            </select>
            <label class="sr" for="f-div">Division</label>
            <select id="f-div" name="division" data-autosubmit>
                <option value="">All divisions</option>
                <option th:each="d : ${divisions}" th:value="${d}" th:text="${d}" th:selected="${d == fDivision}"></option>
            </select>
            <label class="sr" for="f-type">Type</label>
            <select id="f-type" name="type" data-autosubmit>
                <option value="">All types</option>
                <option th:each="t : ${types}" th:value="${t.name()}" th:text="${t.label}" th:selected="${t == fType}"></option>
            </select>
            <input type="hidden" name="stage" th:if="${fStage != null}" th:value="${fStage.name()}">
            <input type="hidden" name="all" th:if="${allCycles}" value="true">
            <button class="btn ghost" type="submit">Search</button>
            <a th:if="${filtered}" class="linkish" th:href="${allCycles} ? @{/(all=true)} : @{/}">Clear filters</a>
        </form>

        <form id="bulk-form" method="post" th:action="@{/feedback/bulk}" class="stack-sm" th:unless="${rows.isEmpty()}">
        <div class="bulk-bar" th:if="${me.canTriage()}">
            <span class="small"><b class="mono" data-count>0</b> ticked</span>
            <label class="sr" for="bulk-action">Action</label>
            <select id="bulk-action" name="action" data-bulk-action required>
                <option value="">Choose an action</option>
                <option value="send">Send to business review</option>
                <option value="info">Ask testers for more info</option>
                <option value="severity">Set severity</option>
                <option value="type">Set type</option>
            </select>
            <label class="sr" for="bulk-sev">Severity</label>
            <select id="bulk-sev" name="severity" data-bulk-for="severity">
                <option th:each="v : ${severities}" th:value="${v.name()}" th:text="${v.label}"></option>
            </select>
            <label class="sr" for="bulk-type">Type</label>
            <select id="bulk-type" name="type" data-bulk-for="type">
                <option th:each="t : ${types}" th:value="${t.name()}" th:text="${t.label}"></option>
            </select>
            <label class="sr" for="bulk-note">What information is needed</label>
            <input id="bulk-note" name="note" data-bulk-for="info" placeholder="What information do you need?" class="grow-input">
            <button class="btn primary small-btn" type="submit">Apply to ticked</button>
        </div>
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr><th class="check" th:if="${me.canTriage()}"><input type="checkbox" data-select-all="ids" aria-label="Tick all shown"></th><th>ID</th><th th:if="${allCycles}">Cycle</th><th>Feedback</th><th>LOB / division</th><th>Type</th><th>Severity</th><th>Stage</th><th>Decision</th><th>Jira</th></tr>
                </thead>
                <tbody>
                <tr th:each="f : ${rows}">
                    <td class="check" th:if="${me.canTriage()}"><input type="checkbox" name="ids" th:value="${f.id}" th:attr="aria-label='Tick ' + ${f.code}"></td>
                    <td class="mono id"><a th:href="@{/feedback/{id}(id=${f.id})}" th:text="${f.code}"></a></td>
                    <td th:if="${allCycles}" class="muted-2 small" th:text="${f.cycle} ?: '—'"></td>
                    <td class="title-cell">
                        <a th:href="@{/feedback/{id}(id=${f.id})}" th:text="${f.title}"></a>
                        <small th:if="${!f.where.isEmpty()}" th:text="${f.where}"></small>
                    </td>
                    <td class="muted-2" th:text="${f.lobDivision}"></td>
                    <td><span th:replace="~{fragments :: type(${f})}"></span></td>
                    <td><span th:replace="~{fragments :: sev(${f})}"></span></td>
                    <td><span th:replace="~{fragments :: rail(${f})}"></span></td>
                    <td class="muted-2" th:text="${f.decision != null ? f.decision.label : '—'}"></td>
                    <td class="mono">
                        <a th:if="${f.jiraUrl != null}" th:href="${f.jiraUrl}" target="_blank" rel="noopener" class="jira-key" th:text="${f.jiraKey}"></a>
                        <span th:if="${f.jiraUrl == null}" class="muted">—</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        </form>

        <div class="empty" th:if="${rows.isEmpty()}">
            <h2 th:text="${filtered} ? 'Nothing matches these filters' : 'No feedback logged yet'"></h2>
            <p th:if="${filtered}">Try a different search, or <a th:href="@{/}">clear the filters</a>.</p>
            <p th:unless="${filtered}">Log the first item, or import your existing UAT sheet with <b>Import Excel</b>.</p>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
