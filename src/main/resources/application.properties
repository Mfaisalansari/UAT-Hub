# ---------- Server ----------
server.port=8080
# The address people use to reach the app. Personal access links are built from this.
uathub.base-url=http://localhost:8080

# ---------- Storage (no installed database: everything lives in ./data) ----------
uathub.data-dir=./data
spring.datasource.url=jdbc:h2:file:${uathub.data-dir}/uat-hub
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.h2.console.enabled=false

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

# ---------- Access links ----------
uathub.cookie-name=UATHUB
uathub.cookie-days=180

# ---------- Reference lists (edit to suit each application) ----------
uathub.lobs=Casualty,Property,Motor,Financial Lines,Construction,Marine,Political,Natural Resource,British Marine
uathub.divisions=Europe,UK,IM

# ---------- Jira (set through environment variables, never commit the token) ----------
# JIRA_DEPLOYMENT = CLOUD (email + API token) or DATA_CENTER (personal access token)
uathub.jira.base-url=${JIRA_BASE_URL:}
uathub.jira.deployment=${JIRA_DEPLOYMENT:CLOUD}
uathub.jira.email=${JIRA_EMAIL:}
uathub.jira.token=${JIRA_TOKEN:}

logging.level.com.uathub=INFO
