name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: uat-hub-jar
          path: target/uat-hub.jar
