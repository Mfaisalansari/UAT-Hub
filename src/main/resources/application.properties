# ---------- Server ----------
server.port=8080
# The address people use to reach the app. Personal access links are built from this.
uathub.base-url=http://localhost:8080

# ---------- Storage (no installed database: everything lives in ./data) ----------
uathub.data-dir=./data
spring.datasource.url=jdbc:h2:file:${uathub.data-dir}/uat-hub
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.h2.console.enabled=false

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

# ---------- Access links ----------
uathub.cookie-name=UATHUB
uathub.cookie-days=180

# ---------- Reference lists (edit to suit each application) ----------
uathub.lobs=Casualty,Property,Motor,Financial Lines,Construction,Marine,Political,Natural Resource,British Marine
uathub.divisions=Europe,UK,IM

# ---------- Jira (set through environment variables, never commit the token) ----------
# JIRA_DEPLOYMENT = CLOUD (email + API token) or DATA_CENTER (personal access token)
uathub.jira.base-url=${JIRA_BASE_URL:}
uathub.jira.deployment=${JIRA_DEPLOYMENT:CLOUD}
uathub.jira.email=${JIRA_EMAIL:}
uathub.jira.token=${JIRA_TOKEN:}

# ---------- Notifications ----------
# Email goes out only when an SMTP server is set, e.g. through environment variables:
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD,
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
# Teams messages go to the webhook set per project (Projects & Jira page).
uathub.notifications.mail-from=${MAIL_FROM:}
# Weekday to-do email to everyone with something waiting (cron: second minute hour day month weekday)
uathub.notifications.digest-enabled=${DIGEST_ENABLED:true}
uathub.notifications.digest-cron=${DIGEST_CRON:0 0 9 * * MON-FRI}

# ---------- AI assist (off unless a provider is set) ----------
# AI_PROVIDER = none | anthropic | openai  (openai = any OpenAI-compatible endpoint, e.g. a company gateway or Ollama)
# Feedback text is sent to the provider: check your company's policy first.
uathub.ai.provider=${AI_PROVIDER:none}
uathub.ai.api-key=${AI_API_KEY:}
uathub.ai.model=${AI_MODEL:}
uathub.ai.base-url=${AI_BASE_URL:}

logging.level.com.uathub=INFO
