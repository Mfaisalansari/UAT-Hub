<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Projects & Jira')}"></head>
<body>
<div class="shell">
    <nav th:replace="~{fragments :: sidebar('projects')}"></nav>
    <main class="main">
        <header class="page-head">
            <div>
                <p class="crumb">Each project has its own UAT cycles, scenarios and Jira mapping.</p>
                <h1 class="title">Projects &amp; Jira</h1>
            </div>
        </header>

        <div th:replace="~{fragments :: flash}"></div>

        <form class="add-person projects-add" method="post" th:action="@{/projects}">
            <div class="field"><label for="n-name">New project</label>
                <input id="n-name" name="name" required placeholder="e.g. Pega Underwriting"></div>
            <div class="field"><label for="n-cycle">First UAT cycle</label>
                <input id="n-cycle" name="currentCycle" placeholder="e.g. October 2026 release"></div>
            <button class="btn primary" type="submit">Create project</button>
        </form>

        <div class="project-grid">
            <form th:each="p : ${allProjects}" class="card stack-sm" method="post" th:action="@{/projects/{id}(id=${p.id})}">
                <div class="grid2">
                    <div class="field"><label th:for="'name-' + ${p.id}">Project name</label>
                        <input th:id="'name-' + ${p.id}" name="name" required th:value="${p.name}"></div>
                    <div class="field"><span class="label">UAT cycles</span>
                        <p class="small muted-2">Each release's UAT window is its own cycle. <a th:href="@{/cycles}">Manage UAT cycles</a> (for the project selected in the sidebar).</p></div>
                </div>
                <h3 class="label">Jira mapping</h3>
                <div class="grid3">
                    <div class="field"><label th:for="'key-' + ${p.id}">Jira project key</label>
                        <input class="mono" th:id="'key-' + ${p.id}" name="jiraProjectKey" th:value="${p.jiraProjectKey}" placeholder="e.g. UWP"></div>
                    <div class="field"><label th:for="'bug-' + ${p.id}">Defect → issue type</label>
                        <input th:id="'bug-' + ${p.id}" name="bugIssueType" th:value="${p.bugIssueType}" placeholder="Bug"></div>
                    <div class="field"><label th:for="'story-' + ${p.id}">Enhancement / future → issue type</label>
                        <input th:id="'story-' + ${p.id}" name="storyIssueType" th:value="${p.storyIssueType}" placeholder="Story"></div>
                </div>
                <div class="grid3">
                    <div class="field"><label th:for="'comp-' + ${p.id}">Components</label>
                        <input th:id="'comp-' + ${p.id}" name="jiraComponents" th:value="${p.jiraComponents}" placeholder="Comma separated, must exist in Jira"></div>
                    <div class="field"><label th:for="'lab-' + ${p.id}">Extra labels</label>
                        <input th:id="'lab-' + ${p.id}" name="jiraLabels" th:value="${p.jiraLabels}" placeholder="Comma separated"></div>
                    <div class="field"><label th:for="'fix-' + ${p.id}">Fix version</label>
                        <input th:id="'fix-' + ${p.id}" name="jiraFixVersion" th:value="${p.jiraFixVersion}" placeholder="Must exist in Jira"></div>
                </div>
                <button class="btn ghost" type="submit">Save project</button>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
